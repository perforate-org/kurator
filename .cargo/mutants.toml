# Mutants that no in-process test can observe. Each needs a reason.
exclude_re = [
    # While Ed25519 is the only algorithm, its id is the constant 1, so
    # returning 1 is the same function. A second algorithm makes it
    # observable through the round-trip test.
    "replace Algorithm::id -> u8 with 1",
    # Kani harnesses and the checksum stand-in they use run under `cargo kani`.
    "proofs::",
    # Directory syncs only matter after power loss.
    "replace sync_dir -> io::Result<\\(\\)> with Ok\\(\\(\\)\\)",
    # Joining the commit thread on drop is not observable: writes are
    # synchronous, so none are queued when the handle drops.
    "<impl Drop for GroupCommit>::drop",
    # The snapshot writer is flushed through `BufWriter`, which also flushes
    # on drop; only a failing disk could tell the difference.
    "Checksummed<W>>::flush",
    # Failing to delete a file for a reason other than "not found" needs a
    # broken file system.
    "match guard error.kind\\(\\) [!=]= io::ErrorKind::NotFound with (true|false)",
    # Dropping the last Raft handle stops the core as well; shutting down
    # only waits for it, which no test can tell apart.
    "replace (Replica<C>|Store<C, T>|Cluster)::shutdown -> Result<.*> with Ok\\(\\(\\)\\)",
    # A stopped replica refuses messages too, so forgetting its inbox only
    # frees memory.
    "replace Network::disconnect with \\(\\)",
    # TLS 1.3 clients with raw public keys ignore certificate authority
    # hints, so no handshake can tell an empty list from another.
    "<impl ClientCertVerifier for Trusted>::root_hint_subjects",
    # Only a broken encoding garbles a simulated message; noticing it only
    # makes such a mutant fail in seconds instead of minutes.
    "replace Network::garbled -> Option<Garbled> with None",
    # Settling waits for each shard's leader to commit in its own term;
    # skipping that wait, or ending it once any one leader did, leaves the convergence check, which polls for
    # longer, to catch up the same.
    "replace Cluster::confirm -> bool with false",
    "replace &= with \\|= in Cluster::settle",
    # A forgotten node stays in a shard only when a leave races a split
    # that no replica up applied yet; no seed in the default set does.
    "replace Cluster::remove_strays with \\(\\)",
    # A leader named by an error only spares the client a lookup: without
    # it, the client tries the leader it finds itself, which is the same.
    "replace <impl Redirect for (Error|MetaError|oleaph_consensus::Error|Redirected)>::leader -> Option<NodeId> with None",
    # The periodic sweep only adds a check that this node leads the meta
    # shard; it runs once a minute, longer than any test waits. The
    # collection it starts is tested through the console's `collect`.
    "replace sweep -> Option<Collected> with None",
    "replace != with == in sweep",
]
timeout_multiplier = 3.0
# The replica code is exercised mostly by oleaph-sim's cluster tests, so
# every mutant runs the whole workspace's tests, not only its own crate's.
test_workspace = true
