name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    name: fmt + clippy + test + doc
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - name: The transport without BFT, as a Raft-only build uses it
        run: cargo clippy -p oleaph-net --all-targets --locked
      - run: cargo test --workspace --locked
      - run: cargo doc --workspace --no-deps --locked
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - name: Unused dependencies
        run: cargo machete

  deslop:
    name: deslop-please
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install && rustup component add rust-analyzer rust-src
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked deslop-please
      - run: deslop-please

  qlty:
    name: qlty
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Install qlty
        run: |
          curl -fsSL https://qlty.sh | bash
          echo "$HOME/.qlty/bin" >> "$GITHUB_PATH"
      - run: qlty check --all --no-progress --trigger build
      - run: qlty smells --all

  kani:
    name: kani proofs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: model-checking/kani-github-action@v1
        with:
          args: --workspace

  quint:
    name: quint specs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The trace validation replays the model's runs against crates/bft.
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Apalache, which `quint verify` runs, needs Java 17 or later.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install quint
        run: npm install --global @informalsystems/quint@0.35.0
      # `quint verify` downloads Apalache into ~/.quint on first use.
      - uses: actions/cache@v4
        with:
          path: ~/.quint
          key: quint-0.35.0-apalache-0.62.4
      - run: specs/check.sh
        env:
          QUINT_SAMPLES: 3000

  simulation:
    name: simulation, 500 seeds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p oleaph-sim --release --locked
        env:
          OLEAPH_SIM_SEEDS: 500

  mutants:
    name: mutation testing (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Every mutant runs the whole workspace's tests, the simulations
    # among them, so the mutants are spread over four runners.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: Mutants in the diff (pull requests)
        if: github.event_name == 'pull_request'
        run: |
          git diff "origin/${{ github.base_ref }}.." > pr.diff
          cargo mutants --workspace --no-shuffle --in-diff pr.diff --timeout 300 -j 2 --shard ${{ matrix.shard }}/4
      - name: All mutants (main)
        if: github.event_name != 'pull_request'
        run: cargo mutants --workspace --no-shuffle --timeout 300 -j 2 --shard ${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants.out-${{ matrix.shard }}
          path: mutants.out
