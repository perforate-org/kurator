[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/perforate-org/kurator"
readme = "../../README.md"
keywords = ["database", "storage", "wal", "p2p"]
categories = ["database-implementations"]

[workspace.dependencies]
kurator-crypto = { path = "crates/crypto" }
kurator-wal = { path = "crates/wal" }
kurator-codec = { path = "crates/codec" }
kurator-storage = { path = "crates/storage" }
kurator-shard = { path = "crates/shard" }
kurator-consensus = { path = "crates/consensus" }
kurator-raft = { path = "crates/raft" }
kurator-meta = { path = "crates/meta" }
kurator-sim = { path = "crates/sim" }
kurator-net = { path = "crates/net" }
crc32c = "0.6.9"
blake3 = "1.8.7"
ed25519-dalek = "3.0.0"
parking_lot = "0.12"
thiserror = "2.0.17"
criterion = "0.8"
tempfile = "3.20"
proptest = "1.7"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
openraft = { version = "0.10.1", default-features = false }
openraft-rt-sim = "0.10.1"
openraft-rt-tokio = "0.10.1"
quinn = { version = "0.11.12", default-features = false, features = [
    "rustls-aws-lc-rs",
    "runtime-tokio",
] }
rustls = { version = "0.23.46", default-features = false, features = [
    "aws_lc_rs",
    "std",
] }
tokio = { version = "1.54", features = ["rt", "net", "time", "sync", "macros"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
unused_results = "deny"
unused_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
single_use_lifetimes = "deny"
let_underscore_drop = "deny"
redundant_lifetimes = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(kani)"] }

[workspace.lints.clippy]
# Groups: everything in pedantic and nursery, plus cargo metadata.
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
multiple_crate_versions = "allow"
redundant_pub_crate = "allow"                # conflicts with rustc's `unreachable_pub`, which we keep # dev-dependencies (criterion, proptest) pull duplicates we cannot control

# Layout: `foo.rs` + `foo/`, never `mod.rs`.
mod_module_files = "deny"

# Encapsulation: no fields visible beyond their type, no public enums or
# structs that callers can build or match exhaustively by accident.
field_scoped_visibility_modifiers = "deny"
exhaustive_enums = "deny"
exhaustive_structs = "deny"
partial_pub_fields = "deny"
pub_without_shorthand = "deny"
module_name_repetitions = "allow"          # `wal::WalOptions`-style names are what we want to avoid, but the lint fires on re-exports too
multiple_inherent_impl = "deny"
same_name_method = "deny"

# Behaviour lives in types: flag bool-typed state and stringly code.
fn_params_excessive_bools = "deny"
struct_excessive_bools = "deny"
str_to_string = "deny"
inefficient_to_string = "deny"

# No panics, unchecked arithmetic or unchecked indexing in library code:
# a storage engine must fail with an error, not abort the process.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
unwrap_in_result = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
cast_lossless = "deny"
integer_division = "deny"
float_arithmetic = "deny"
exit = "deny"
mem_forget = "deny"
get_unwrap = "deny"

# Hygiene.
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
missing_assert_message = "deny"
missing_docs_in_private_items = "allow"  # private items are documented where they are not obvious
clone_on_ref_ptr = "deny"
if_then_some_else_none = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
rest_pat_in_fully_bound_structs = "deny"
semicolon_if_nothing_returned = "deny"
shadow_unrelated = "deny"
unneeded_field_pattern = "deny"
verbose_file_reads = "deny"
wildcard_enum_match_arm = "deny"
lossy_float_literal = "deny"
mixed_read_write_in_expression = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
mutex_atomic = "deny"
try_err = "deny"
unused_trait_names = "deny"
needless_raw_strings = "deny"
redundant_type_annotations = "deny"
renamed_function_params = "deny"
string_lit_chars_any = "deny"
filetype_is_file = "deny"
create_dir = "deny"
large_include_file = "deny"
impl_trait_in_params = "allow"           # `impl Into<PathBuf>` keeps call sites simple

[profile.bench]
debug = true

# Signing, hashing and the simulator are dozens of times slower unoptimized,
# which makes the simulation tests too slow for `cargo test` and mutants.
[profile.dev.package."*"]
opt-level = 3
