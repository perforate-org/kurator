[package]
name = "oleaph-node"
description = "An OleaphDB replica as a process: the signed-WAL Raft replica on the QUIC transport, driven from a console"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[[bin]]
name = "oleaph"
path = "src/main.rs"

[dependencies]
getrandom = "0.4.3"
oleaph-bft.workspace = true
oleaph-client.workspace = true
oleaph-meta.workspace = true
oleaph-consensus.workspace = true
oleaph-crypto.workspace = true
oleaph-net = { workspace = true, features = ["bft"] }
oleaph-raft.workspace = true
oleaph-shard.workspace = true
oleaph-storage.workspace = true
oleaph-wal.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "io-std", "io-util"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
