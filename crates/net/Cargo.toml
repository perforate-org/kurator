[package]
name = "oleaph-net"
description = "QUIC transport for OleaphDB replicas: persistent connections, binary RPC, Ed25519 raw-public-key authentication"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# BFT replicas on the same transport. Off by default: a Raft-only build
# does not depend on the BFT crate.
bft = ["dep:oleaph-bft", "dep:parking_lot"]

[dependencies]
oleaph-bft = { workspace = true, optional = true }
oleaph-client.workspace = true
oleaph-meta.workspace = true
oleaph-consensus.workspace = true
oleaph-crypto.workspace = true
oleaph-raft.workspace = true
oleaph-shard.workspace = true
oleaph-storage.workspace = true
openraft-rt-tokio.workspace = true
parking_lot = { workspace = true, optional = true }
quinn.workspace = true
rustls.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
oleaph-wal.workspace = true
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[[test]]
name = "bft"
required-features = ["bft"]

[lints]
workspace = true
